[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screentime-controller"
dynamic = ["version"]
description = "Household screen-time controller driving pfSense runtime firewall tables."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Floors are the Raspberry Pi OS Trixie (Debian 13) package versions, which is what the
    # Pi runs (deploy/apt-packages.txt). Do not raise a floor to fix a test: fix the code.
    "fastapi>=0.115",
    "starlette>=0.46",
    "pydantic>=2.10",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.40",
    "alembic>=1.13",
    "argon2-cffi>=21.1",
    "pyyaml>=6.0",
    "dnspython>=2.7",
    "cryptography>=43",
    "py-vapid>=1.9",
    "http-ece>=1.2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]
e2e = ["playwright>=1.47"]

# The application is run from its source tree (see deploy/install.sh); this
# metadata exists to declare dependencies and tool configuration only.
[tool.setuptools]
packages = []

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: browser end-to-end tests (need Playwright and a Chromium build)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = [
    "S101",   # assert is fine in tests and invariants
    "B008",   # FastAPI Depends() in defaults is the idiom
    "E501",   # long user-facing message strings; ruff format handles code
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S603", "S607", "S311"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "scripts"]
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["http_ece.*", "py_vapid.*", "dns.*", "argon2.*"]
ignore_missing_imports = true
