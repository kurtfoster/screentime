# Screen-Time Controller: production configuration template.
# Copy to /opt/screentime/config/config.yaml and edit. Invalid values stop the service
# from starting; validate with:  python -m app --check-config
# Times are quoted "HH:MM" strings (unquoted HH:MM is misread by YAML).

timezone: Australia/Melbourne
logical_day_reset: "02:00"          # 02:00 belongs to the *new* day; history is never deleted

children:
  child8:
    display_name: "Child 8"
    username: "child8"              # login name; set its password from the parent dashboard
    weekday_allowance_minutes: 120
    weekend_allowance_minutes: 180
    weekday_earliest_start: "09:00"
    owned_devices: [ipad]           # optional cross-check against devices.<id>.owner
    permitted_shared_devices: [kids_tv, lounge_tv]   # shared_tv devices only
  child12:
    display_name: "Child 12"
    username: "child12"
    weekday_allowance_minutes: 120
    weekend_allowance_minutes: 180
    weekday_earliest_start: "09:00"
    owned_devices: [iphone_child12]
    permitted_shared_devices: [kids_tv, lounge_tv]

# NOTE: the specification's sample listed `ipad` under both children's shared devices while
# also declaring it a personal device owned by child8. Personal devices are usable by their
# owner only, so this template lists shared devices under permitted_shared_devices and the
# iPad under its owner. For a genuinely shared iPad, set `type: shared_tv` and drop `owner`.
devices:
  ipad:
    display_name: "iPad"
    ip: "192.168.12.30"             # must be a static DHCP mapping on pfSense
    type: personal
    owner: child8
  iphone_child12:
    display_name: "iPhone"
    ip: "192.168.12.31"
    type: personal
    owner: child12
  kids_tv:
    display_name: "Kids TV"
    ip: "192.168.12.40"
    type: shared_tv
    weekday_cutoff: "18:30"         # hard stop on weekdays (logical day), overridable by a parent
  lounge_tv:
    display_name: "Lounge TV"
    ip: "192.168.12.41"
    type: shared_tv

sessions:
  default_minutes: 30
  child_choices_minutes: [15, 30, 60]
  child_extension_minutes: 15
  warning_minutes: 5
  max_concurrent_devices_per_child: 1
  stop_returns_unused_reserved_time: true

parents:
  tv_session_choices_minutes: [15, 30, 60]
  allow_until_stopped: true
  allowance_grants_minutes: [15, 30, 60]
  grants_override_all_child_restrictions: true
  until_stopped_end_at_logical_day_reset: true

# The education allowlist is not configured here: it is the pfSense Host alias SCR_EDU_ALLOW
# (hostnames, resolved by pfSense), and which devices may use it is the alias SCR_EDU_DEVICES.
# See OPERATIONS.md section 2.

firewall:
  mode: dry_run                     # dry_run | pfsense_pull   (switch at Gate B, OPERATIONS.md 2)
  host: "192.168.12.1"              # pfSense: the only address that may fetch /firewall/v1/*
  reconcile_seconds: 30             # how often the desired state is recomputed
  max_lease_seconds: 900            # longest lease pfSense is given (renewed every poll)
  ack_timeout_seconds: 150          # a start pfSense never confirms is ended and refunded
  degraded_after_seconds: 180       # "pfSense is not checking in": parents warned, starts refused
  stale_grace_seconds: 600          # must equal STALE_GRACE on pfSense (firewall-check compares)

notifications:
  browser_push_enabled: true
  warning_minutes: 5                # must equal sessions.warning_minutes
  parent_notifications_enabled: true

security:
  secure_cookies: true              # requires HTTPS (deploy/install.sh sets up a local CA)
  session_ttl_minutes: 720
  login_max_failures: 5
  login_window_minutes: 15
  login_lockout_minutes: 15
  grant_actions_per_minute: 20
  trusted_proxies: ["127.0.0.1", "::1"]   # nginx on the same host
  password_min_length: 4           # every account (owner decision D9; SECURITY.md deviation)
  password_hash:                    # Argon2id; values below the OWASP minimum are rejected
    memory_kib: 19456               # 19 MiB: about 1.4 s per login on a Raspberry Pi 1
    time_cost: 2
    parallelism: 1                  # one core: more lanes add memory, not speed

storage:
  data_dir: /opt/screentime/data    # SQLite database, app secret and VAPID key live here
  runtime_dir: /run/screentime      # status snapshot for admin_cli (tmpfs: no SD card writes)

clock:
  # The Pi has no battery-backed clock. Until systemd-timesyncd has synchronised (NTP from
  # pfSense), no device is granted and child starts are refused with CLOCK_NOT_SYNCED.
  require_sync: true
  sync_marker: /run/systemd/timesync/synchronized

push:
  vapid_subject: "mailto:parents@example.invalid"   # contact address sent to push services
  allowed_endpoint_hosts:           # push services a browser subscription may point at
    - web.push.apple.com            # iPhone / iPad Home Screen apps
    - fcm.googleapis.com            # Chrome, Edge on Android
    - updates.push.services.mozilla.com
    - notify.windows.com
