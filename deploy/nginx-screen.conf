# Screen-Time Controller: nginx reverse proxy. LAN only; never port-forward this from the WAN.
# Placeholders (@HOSTNAME@, @TLS_DIR@) are filled in by deploy/install.sh.

# Slow down password guessing before it reaches the app (the app also locks accounts).
limit_req_zone $binary_remote_addr zone=screentime_login:1m rate=10r/m;

# Plain HTTP exists for two things only: fetching the local CA certificate for iPhones/iPads,
# and redirecting to HTTPS. Nothing else is served.
server {
    listen 80;
    listen [::]:80;
    server_name @HOSTNAME@;

    include /etc/nginx/snippets/screentime-lan-only.conf;

    location = /ca.crt {
        alias @TLS_DIR@/ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="screentime-ca.crt"';
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name @HOSTNAME@;

    include /etc/nginx/snippets/screentime-lan-only.conf;

    ssl_certificate     @TLS_DIR@/screen-fullchain.crt;
    ssl_certificate_key @TLS_DIR@/screen.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1h;
    ssl_session_cache   shared:screentime_tls:1m;

    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 10s;

    location = /login {
        limit_req zone=screentime_login burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/screentime-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/screentime-proxy.conf;
    }
}
