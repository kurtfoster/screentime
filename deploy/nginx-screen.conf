# Screen-Time Controller: nginx reverse proxy. LAN only; never port-forward this from the WAN.
# Placeholders (@HOSTNAME@, @TLS_DIR@, @FIREWALL_HOST@) are filled in by deploy/install.sh.
# This file is included in nginx's http block. Both servers are default_server, so a request
# for any other name (the bare IP address, say) reaches this app, never a stock page.

# No nginx version in headers or error pages, for every server (CWE-200).
server_tokens off;

# Slow down password guessing before it reaches the app (the app also locks accounts).
limit_req_zone $binary_remote_addr zone=screentime_login:1m rate=10r/m;
# pfSense polls once a minute (at most six times with POLLS_PER_MINUTE): fetch plus acknowledge.
limit_req_zone $binary_remote_addr zone=screentime_firewall:1m rate=30r/m;

# Plain HTTP exists for two things only: fetching the local CA certificate for iPhones/iPads,
# and redirecting to HTTPS. Nothing else is served.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name @HOSTNAME@;

    include /etc/nginx/snippets/screentime-lan-only.conf;

    location = /ca.crt {
        alias @TLS_DIR@/ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="screentime-ca.crt"';
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name @HOSTNAME@;

    include /etc/nginx/snippets/screentime-lan-only.conf;

    ssl_certificate     @TLS_DIR@/screen-fullchain.crt;
    ssl_certificate_key @TLS_DIR@/screen.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1h;
    ssl_session_cache   shared:screentime_tls:1m;

    client_max_body_size 16k;
    client_body_timeout 10s;

    location = /login {
        limit_req zone=screentime_login burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/screentime-proxy.conf;
    }

    # Passwords are checked here too (siblings, password changes), and each check costs about
    # 1.4 s of CPU on a Pi 1.
    location ~ ^/(api/child/(shared/[0-9]+/add-participant|session/start)|account/password|api/parent/user/[a-z0-9_.-]+/password)$ {
        limit_req zone=screentime_login burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/screentime-proxy.conf;
    }

    # pfSense fetches the desired state and acknowledges it here (v1.2 pull model). Only
    # pfSense's address may reach it; the app also checks the address and a bearer token.
    location /firewall/ {
        allow @FIREWALL_HOST@;
        deny all;
        limit_req zone=screentime_firewall burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/screentime-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/screentime-proxy.conf;
    }
}
