{# A password input with a show/hide toggle (M8). Args: name, label, autocomplete, hint. #}
<label class="field">{{ label }}
  <span class="pw-wrap">
    <input type="password" name="{{ name }}" autocomplete="{{ autocomplete }}" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="128" required>
    <button class="pw-toggle" type="button" data-toggle-password aria-label="Show password" aria-pressed="false">Show</button>
  </span>
  {% if hint %}<span class="hint">{{ hint }}</span>{% endif %}
</label>
